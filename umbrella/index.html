<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adapt-1 Machina — Interactive 3D Walking Umbrella</title>
<style>
  :root {
    --bg: #0e1118;
    --card: #181c26;
    --border: #374155;
    --text: #ebeffa;
    --muted: #a5afbf;
    --accent: #4bdca0;
    --warn: #ffc855;
    --danger: #f05f5f;
    --blue: #5fafff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center;
  }
  .container {
    width: 100%; max-width: 1000px;
  }
  .toolbar {
    background: var(--card); border: 2px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between;
  }
  .btn-group {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  }
  button {
    background: #252c3d; color: var(--text);
    border: 1px solid #4a5772; border-radius: 8px;
    padding: 8px 12px; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.12s ease;
    user-select: none;
  }
  button:hover { background: #323c52; border-color: #6b7d9e; }
  button:active { transform: translateY(1px); }
  button.primary { background: #236b4e; border-color: #38a879; color: #fff; }
  button.primary:hover { background: #2c8460; }
  button.step-win { background: #26466e; border-color: #487fc2; }
  button.step-win:hover { background: #31598a; }
  .scrubber-row {
    width: 100%; display: flex; align-items: center; gap: 12px; margin-top: 6px;
  }
  input[type=range] {
    flex: 1; accent-color: var(--accent); cursor: pointer;
  }
  .status-pill {
    font-size: 13px; color: var(--muted); white-space: nowrap;
  }
  .status-pill strong { color: var(--text); }
  canvas {
    width: 100%; height: auto;
    background: var(--bg); border-radius: 12px;
    border: 1px solid #283042;
    display: block;
  }
  .hint {
    margin-top: 8px; font-size: 12px; color: var(--muted); text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
    <div class="btn-group">
      <button id="btnReset" title="Reset to t=0.00s (Home)">⏮ Reset</button>
      <button id="btnPrevWin" class="step-win" title="Back 1 Window (-0.16s / -8 ticks, PageUp)">⏪ -1 Win (0.16s)</button>
      <button id="btnPrevTick" title="Step Back 1 Tick (-0.02s, Left Arrow)">◀ -1 Tick (20ms)</button>
      <button id="btnPlay" class="primary" title="Play / Pause (Space)">▶ Play</button>
      <button id="btnNextTick" title="Step Forward 1 Tick (+0.02s, Right Arrow)">+1 Tick (20ms) ▶</button>
      <button id="btnNextWin" class="step-win" title="Forward 1 Window (+0.16s / +8 ticks, PageDown)">+1 Win (0.16s) ⏩</button>
    </div>
    <div class="btn-group">
      <label style="font-size:12px;color:var(--muted);">Speed:</label>
      <button class="spd" data-spd="0.25">0.25×</button>
      <button class="spd" data-spd="0.5">0.5×</button>
      <button class="spd primary" data-spd="1">1×</button>
    </div>
    <div class="scrubber-row">
      <span class="status-pill" id="lblTick">Tick <strong>0 / 111</strong></span>
      <input type="range" id="slider" min="0" max="111" value="0" step="1">
      <span class="status-pill" id="lblTime">t = <strong>0.00s</strong> | Win <strong>1/14</strong> | Stride <strong>1/2</strong></span>
    </div>
  </div>

  <canvas id="cv" width="980" height="495"></canvas>
  <div class="hint">
    Keyboard shortcuts: <b>← / →</b> step 1 tick (20 ms) &nbsp;|&nbsp; <b>Shift+← / Shift+→</b> step 1 window (0.16 s = new Machina evaluation) &nbsp;|&nbsp; <b>Space</b> Play/Pause
  </div>
</div>

const FALL_LIMIT = 0.5236;
const PASS_LIMIT = 0.1500;
const N = DATA.sober.length;

let idx = 0;
let playing = false;
let speedMult = 1.0;
let lastFrameTime = 0;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const slider = document.getElementById('slider');

const lblTime = document.getElementById('lblTime');
const btnPlay = document.getElementById('btnPlay');

function roundRect(x, y, w, h, r, fill, stroke, sw=2) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.lineWidth = sw; ctx.strokeStyle = stroke; ctx.stroke(); }
}

function drawPanel(x0, y0, pw, ph, title, subtitle, trace, i, accent) {
  const r = trace[i];
  roundRect(x0, y0, pw, ph, 12, '#181c26', '#374155', 2);

  ctx.font = 'bold 14px ui-monospace, monospace';
  ctx.fillStyle = accent;
  ctx.fillText(title, x0 + 14, y0 + 24);

  ctx.font = '12px ui-monospace, monospace';
  ctx.fillStyle = '#a5afbf';
  ctx.fillText(subtitle, x0 + 14, y0 + 43);

  // Badge
  let bTxt = '', bCol = '#4187dc';
  if (r.f) {
    bTxt = `FELL @ ${r.fa.toFixed(2)}s`;
    bCol = '#dc3c3c';
  } else if (i === N - 1) {
    bTxt = '2 STRIDES BALANCED';
    bCol = '#28c36e';
  } else {
    bTxt = `STRIDE ${r.t < 1.12 ? 1 : 2} / 2`;
  }
  roundRect(x0 + pw - 148, y0 + 11, 136, 24, 6, bCol, null);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 11px ui-monospace, monospace';
  ctx.fillText(bTxt, x0 + pw - 140, y0 + 27);

  // Ground
  const groundY = y0 + 275;
  ctx.strokeStyle = '#4b556e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x0 + 15, groundY);
  ctx.lineTo(x0 + pw - 15, groundY);
  ctx.stroke();

  const phasePx = Math.floor((r.t * 90) % 36);
  ctx.strokeStyle = '#3c465a';
  for (let gx = x0 + 20 - phasePx; gx < x0 + pw - 15; gx += 36) {
    if (gx >= x0 + 15) {
      ctx.beginPath();
      ctx.moveTo(gx, groundY);
      ctx.lineTo(gx - 8, groundY + 8);
      ctx.stroke();
    }
  }

  const cx = x0 + Math.floor(pw / 2);
  const handOffsetX = Math.max(-75, Math.min(75, Math.round(r.x * 55)));
  const hipSwayX = Math.round(10 * Math.sin(2 * Math.PI * 0.9 * r.st));
  const bounceY = Math.round(-6 * Math.sin(2 * Math.PI * 3.6 * r.st));

  const hipX = cx + hipSwayX;
  const hipY = groundY - 52 + bounceY;
  const shoulderX = hipX;
  const shoulderY = hipY - 42;
  const headY = shoulderY - 16;

  // Legs
  const legSwing = 18 * Math.sin(2 * Math.PI * 1.8 * r.st);
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#96a5be';
  ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(hipX - legSwing, groundY); ctx.stroke();
  ctx.strokeStyle = '#6e7d96';
  ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(hipX + legSwing, groundY); ctx.stroke();

  // Torso & head
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#b4c3dc';
  ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(shoulderX, shoulderY); ctx.stroke();
  ctx.fillStyle = '#c8d7eb';
  ctx.beginPath(); ctx.arc(shoulderX, headY, 10, 0, Math.PI * 2); ctx.fill();

  // Hand & Arm
  const handX = cx + handOffsetX;
  const handY = shoulderY - 8 + bounceY;
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#e6c878';
  ctx.beginPath(); ctx.moveTo(shoulderX, shoulderY + 6); ctx.lineTo(handX, handY); ctx.stroke();
  ctx.fillStyle = '#ffd764';
  ctx.beginPath(); ctx.arc(handX, handY, 4.5, 0, Math.PI * 2); ctx.fill();

  // Cones
  const umbLen = 115;
  for (const [lim, col] of [[FALL_LIMIT, '#552d37'], [PASS_LIMIT, '#285041']]) {
    const dx = umbLen * Math.sin(lim);
    const dy = umbLen * Math.cos(lim);
    ctx.lineWidth = 1;
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.moveTo(handX, handY); ctx.lineTo(handX - dx, handY - dy);
    ctx.moveTo(handX, handY); ctx.lineTo(handX + dx, handY - dy);
    ctx.stroke();
  }

  // Umbrella shaft & canopy
  let visAngle = r.tx * (r.f ? 1.0 : 1.8);
  visAngle = Math.max(-1.45, Math.min(1.45, visAngle));
  const tipX = handX + umbLen * Math.sin(visAngle);
  const tipY = handY - umbLen * Math.cos(visAngle);
  const shaftCol = r.f ? '#f05f5f' : accent;

  ctx.lineWidth = 3;
  ctx.strokeStyle = '#e6ebf5';
  ctx.beginPath(); ctx.moveTo(handX, handY); ctx.lineTo(tipX, tipY); ctx.stroke();

  const uxDir = Math.sin(visAngle), uyDir = -Math.cos(visAngle);
  const pxDir = -uyDir, pyDir = uxDir;
  const canopyR = 38;
  ctx.beginPath();
  for (let aDeg = -90; aDeg <= 90; aDeg += 10) {
    const rad = aDeg * Math.PI / 180;
    const along = -14 * Math.cos(rad);
    const perp = canopyR * Math.sin(rad);
    const px = tipX + along * uxDir + perp * pxDir;
    const py = tipY + along * uyDir + perp * pyDir;
    if (aDeg === -90) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = shaftCol; ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = '#ffffff'; ctx.stroke();

  // Action arrow
  const actPx = Math.round(r.ux * 55);
  if (Math.abs(actPx) > 2) {
    const ayBar = handY + 16;
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#ffbe3c';
    ctx.beginPath(); ctx.moveTo(handX, ayBar); ctx.lineTo(handX + actPx, ayBar); ctx.stroke();
    const s = actPx > 0 ? 1 : -1;
    ctx.fillStyle = '#ffbe3c';
    ctx.beginPath();
    ctx.moveTo(handX + actPx + 6 * s, ayBar);
    ctx.lineTo(handX + actPx - 4 * s, ayBar - 5);
    ctx.lineTo(handX + actPx - 4 * s, ayBar + 5);
    ctx.closePath(); ctx.fill();
  }

  // Telemetry
  const ty0 = groundY + 28;
  const tiltMag = Math.hypot(r.tx, r.ty);
  const tCol = r.f ? '#f55f5f' : (tiltMag < PASS_LIMIT ? '#5ae691' : '#f5c855');
  ctx.font = '12px ui-monospace, monospace';
  ctx.fillStyle = tCol;
  const degX = (r.tx * 180 / Math.PI).toFixed(1);
  const degY = (r.ty * 180 / Math.PI).toFixed(1);
  ctx.fillText(`roll θx : ${r.tx >= 0 ? '+' : ''}${r.tx.toFixed(3)} rad (${r.tx >= 0 ? '+' : ''}${degX}°)  ωx:${r.wx >= 0 ? '+' : ''}${r.wx.toFixed(2)}`, x0 + 14, ty0);
  ctx.fillText(`pitch θy: ${r.ty >= 0 ? '+' : ''}${r.ty.toFixed(3)} rad (${r.ty >= 0 ? '+' : ''}${degY}°)  ωy:${r.wy >= 0 ? '+' : ''}${r.wy.toFixed(2)}`, x0 + 14, ty0 + 18);
  ctx.fillStyle = '#ffcd5f';
  ctx.fillText(`cmd ux,y: (${r.ux >= 0 ? '+' : ''}${r.ux.toFixed(2)}, ${r.uy >= 0 ? '+' : ''}${r.uy.toFixed(2)}) ×15 m/s²`, x0 + 14, ty0 + 36);

  // Mini chart
  const gx0 = x0 + 14, gy0 = ty0 + 50, gw = pw - 28, gh = 56;
  ctx.fillStyle = '#10141c';
  ctx.strokeStyle = '#2d374b';
  ctx.lineWidth = 1;
  ctx.fillRect(gx0, gy0, gw, gh);
  ctx.strokeRect(gx0, gy0, gw, gh);

  const passY = gy0 + gh - Math.round((PASS_LIMIT / 0.55) * gh);
  ctx.strokeStyle = '#2d7855';
  ctx.beginPath(); ctx.moveTo(gx0, passY); ctx.lineTo(gx0 + gw, passY); ctx.stroke();
  ctx.fillStyle = '#50a573';
  ctx.font = '10px ui-monospace, monospace';
  ctx.fillText('0.15 rad pass limit', gx0 + 4, passY - 4);

  // Window boundary vertical ticks in chart
  ctx.strokeStyle = '#1d2536';
  for (let w = 8; w < N; w += 8) {
    const wx = gx0 + (w / (N - 1)) * gw;
    ctx.beginPath(); ctx.moveTo(wx, gy0); ctx.lineTo(wx, gy0 + gh); ctx.stroke();
  }

  if (i >= 1) {
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#6ea0f0';
    ctx.beginPath();
    for (let j = 0; j <= i; j++) {
      const px = gx0 + (j / (N - 1)) * gw;
      const py = gy0 + gh - (Math.min(0.55, Math.abs(trace[j].ty)) / 0.55) * gh;
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.strokeStyle = accent;
    ctx.beginPath();
    for (let j = 0; j <= i; j++) {
      const px = gx0 + (j / (N - 1)) * gw;
      const py = gy0 + gh - (Math.min(0.55, Math.abs(trace[j].tx)) / 0.55) * gh;
      if (j === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
}

function render() {
  ctx.fillStyle = '#0e1118';
  ctx.fillRect(0, 0, cv.width, cv.height);

  const r = DATA.sober[idx];
  const strideNow = r.t < 1.12 ? 1 : 2;
  const isWinBoundary = (idx % 8 === 0);

  ctx.font = 'bold 14px ui-monospace, monospace';
  ctx.fillStyle = '#ebeffa';
  ctx.fillText(
    `Adapt-1 Machina (contextual_execution) — Holdout Seed 90000  |  t = ${r.t.toFixed(2)}s / 2.22s  (Stride ${strideNow}/2, Window ${r.w}/14${isWinBoundary ? ' ★ NEW EVALUATE CALL' : ''})`,
    18, 26
  );

  const pw = 306, ph = 432, y0 = 44;
  drawPanel(16,             y0, pw, ph, '1. Uncontrolled (Base u=0)',  'Tips over in Stride 1 (t=0.74s)', DATA.uncontrolled, idx, '#eb5f5f');
  drawPanel(16 + pw + 15,   y0, pw, ph, '2. Machina Sober (beers=0.0)','Zero scaffold | End tilt 0.020 rad', DATA.sober, idx, '#4bdca0');
  drawPanel(16 + 2*(pw+15), y0, pw, ph, '3. Machina Drunk (beers=0.8)','Heavy stumbles | End tilt 0.049 rad', DATA.drunk, idx, '#5fafff');

  slider.value = idx;
  lblTick.innerHTML = `Tick <strong>${idx} / ${N - 1}</strong>${isWinBoundary ? ' <span style="color:#ffd764">(Window Start)</span>' : ''}`;
  lblTime.innerHTML = `t = <strong>${r.t.toFixed(2)}s</strong> | Win <strong>${r.w}/14</strong> | Stride <strong>${strideNow}/2</strong>`;
}

function setIdx(newIdx) {
  idx = Math.max(0, Math.min(N - 1, newIdx));
  render();
}

function setPlaying(p) {
  playing = p;
  btnPlay.textContent = playing ? '⏸ Pause' : '▶ Play';
  if (playing) {
    if (idx >= N - 1) idx = 0;
    lastFrameTime = performance.now();
    requestAnimationFrame(loop);
  }
}

function loop(now) {
  if (!playing) return;
  const interval = 20 / speedMult; // 20ms per physics tick at 1x
  if (now - lastFrameTime >= interval) {
    lastFrameTime = now;
    if (idx < N - 1) {
      idx++;
      render();
    } else {
      setPlaying(false);
      return;
    }
  }
  requestAnimationFrame(loop);
}

document.getElementById('btnReset').onclick = () => { setPlaying(false); setIdx(0); };
document.getElementById('btnPrevTick').onclick = () => { setPlaying(false); setIdx(idx - 1); };
document.getElementById('btnNextTick').onclick = () => { setPlaying(false); setIdx(idx + 1); };
document.getElementById('btnPrevWin').onclick = () => {
  setPlaying(false);
  const prevBoundary = (idx % 8 === 0) ? idx - 8 : Math.floor(idx / 8) * 8;
  setIdx(prevBoundary);
};
document.getElementById('btnNextWin').onclick = () => {
  setPlaying(false);
  const nextBoundary = (Math.floor(idx / 8) + 1) * 8;
  setIdx(nextBoundary);
};
btnPlay.onclick = () => setPlaying(!playing);
slider.oninput = (e) => { setPlaying(false); setIdx(parseInt(e.target.value, 10)); };

document.querySelectorAll('.spd').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.spd').forEach(b => b.classList.remove('primary'));
    btn.classList.add('primary');
    speedMult = parseFloat(btn.dataset.spd);
  };
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') { e.preventDefault(); setPlaying(false); setIdx(e.shiftKey ? (Math.floor(idx / 8) + 1) * 8 : idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); setPlaying(false); setIdx(e.shiftKey ? ((idx % 8 === 0) ? idx - 8 : Math.floor(idx / 8) * 8) : idx - 1); }
  else if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'Home') { e.preventDefault(); setPlaying(false); setIdx(0); }
  else if (e.key === 'End') { e.preventDefault(); setPlaying(false); setIdx(N - 1); }
});

render();
</script>
</body>
</html>
